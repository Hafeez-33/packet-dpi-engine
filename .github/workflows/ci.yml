name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-build-and-test:
    name: C++ Core Build & CTest (Windows UCRT64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64 Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -G Ninja -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DPACKET_DPI_BUILD_TESTS=ON \
            -DPACKET_DPI_ENABLE_WARNINGS_AS_ERRORS=ON \
            -DPACKET_DPI_BUILD_BENCHMARKS=OFF

      - name: Build C++ Core & Test Targets
        shell: msys2 {0}
        run: |
          cmake --build build --verbose

      - name: Run CTest Regression Suite
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure --verbose

  python-backend-test:
    name: Dashboard Backend Pytest (Python 3.12)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: dashboard/backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/backend/requirements.txt pytest

      - name: Run Backend Pytest Suite
        run: |
          python -m pytest dashboard/tests -v
